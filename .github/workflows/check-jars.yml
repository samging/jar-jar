# Two steps for every package jar here.
#
# 1. The AmiePackage contract, as the website's upload check holds a jar to it: a public class with a no-arg
#    constructor, List<String> run(String) and close(), both required, inherited ones counting. Also what amie checks
#    before it keeps a download: it reads as a jar, its classes load on Java 21, and its META-INF/amie/package.json
#    parses with its "java" and "entry" holding. Classes are loaded without being initialized: no code of a jar runs.
# 2. run() and close() called, as `amie packages test` calls them: the package class is made in a class loader of its
#    own with its config folder, configure() is called, each test its metadata declares goes through run() and is
#    checked, and close() is called. Every jar runs in a JVM of its own, with 30 s per call and 120 s per jar.
#
# Step 2 runs the jars' code, so the job has a read-only token, keeps no credentials from the checkout and gets no
# secrets; pull requests from forks get none either.
name: Check jars

on:
  pull_request:
    paths: ["**.jar", ".github/**"]
  push:
    branches: [main]
    paths: ["**.jar", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Java amie runs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # amie puts its own Kotlin standard library under every package, so a Kotlin jar need not bundle one
      - name: The Kotlin standard library amie provides
        run: curl -fsSL -o "$RUNNER_TEMP/kotlin-stdlib.jar" https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.0/kotlin-stdlib-2.1.0.jar

      - name: Check every jar, running none of its code
        run: git ls-files -z '*.jar' | xargs -0 java .github/scripts/CheckJars.java --provided "$RUNNER_TEMP/kotlin-stdlib.jar"

      - name: Call run() and close() of every jar
        run: git ls-files -z '*.jar' | xargs -0 java .github/scripts/CheckJars.java --provided "$RUNNER_TEMP/kotlin-stdlib.jar" --run
